spring:
  elasticsearch:
    uris: http://localhost:9201  # unreachable → ElasticsearchQueryService falls back to empty via catch blocks

  kafka:
    bootstrap-servers: localhost:9093  # overridden by @DynamicPropertySource in Kafka tests

  flyway:
    enabled: false  # Testcontainers tests use ddl-auto=create-drop instead

  jpa:
    hibernate:
      ddl-auto: create-drop  # for Testcontainers

ai:
  service:
    url: http://localhost:1  # unreachable → HealthController marks AI service as DOWN
