[server]
http_port = 3001
root_url = http://localhost:3001

[security]
admin_user = admin
admin_password = crimelens_admin
secret_key = crimelens_secret_key_change_in_production

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/crimelens_overview.json

[alerting]
enabled = true

[unified_alerting]
enabled = false

[log]
level = warn

[metrics]
enabled = true
