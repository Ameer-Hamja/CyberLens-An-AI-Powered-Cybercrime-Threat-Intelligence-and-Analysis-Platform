[server]
http_port = 3001
root_url = http://localhost:3001

[security]
admin_user = admin

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/json/crimelens_overview.json

[unified_alerting]
enabled = true

[log]
level = warn

[metrics]
enabled = true
