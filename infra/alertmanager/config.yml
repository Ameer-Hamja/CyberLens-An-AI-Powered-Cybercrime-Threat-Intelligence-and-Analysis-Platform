global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@crimelens.in'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'
  routes:
    - match:
        severity: critical
      receiver: 'null'
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'null'
      repeat_interval: 4h
    - match:
        severity: info
      receiver: 'null'

receivers:
  - name: 'crimelens-email'
    email_configs:
      - to: 'ameer@crimelens.in'
        headers:
          Subject: '[CrimeLens][{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Started: {{ .StartsAt.Format "2006-01-02 15:04:05 IST" }}
          {{ end }}
        send_resolved: true

  - name: 'null'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
